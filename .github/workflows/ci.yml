name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: healthpulse_sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: node scripts/check-errors.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - run: node scripts/check-demo.mjs
        working-directory: frontend
  mysql-sample:
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: healthpulse_sample
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: healthpulse_sample
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/init_mysql_sample.py
      - run: python scripts/check_mysql_sample.py
      - run: python -m unittest test_explorer
        working-directory: backend
        env:
          HEALTHPULSE_LIVE_TESTS: '1'

